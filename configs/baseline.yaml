mode: baseline
generation:
  temperature: 1.0
  max_tokens: 2048
  top_p: 0.95
  presence_penalty: 1.5
  extra_body:
    enable_thinking: false
    min_p: 0.0
    repetition_penalty: 1.0
    chat_template_kwargs:
      enable_thinking: false
simulator_generation:
  # Patient/assistant use temperature 0.6; expert scoring uses 0.0.
  # Neither inherits the local doctor's presence penalty.
  temperature: 0.7
  max_tokens: 2048
  top_p: 0.95
  presence_penalty: 0.0
  extra_body:
    enable_thinking: false
runtime:
  max_turns: 10
  timeout_seconds: 120.0
  max_retries: 2

